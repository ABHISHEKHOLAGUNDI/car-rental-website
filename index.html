<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Benaka Travels</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/benaka_travels_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f7; color: #1a1a1a; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        ::-webkit-scrollbar { display: none; }

        /* ====== STATUS BAR & SAFE AREAS ====== */
        .safe-top { padding-top: max(env(safe-area-inset-top), 16px); }
        .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 20px); }

        /* ====== HEADER ====== */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(0,0,0,0.08);
        }
        .header-inner { padding: 12px 20px 14px; }
        .header-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #007AFF, #0051D5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 16px; box-shadow: 0 2px 8px rgba(0,122,255,0.3); }
        .brand-text h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; color: #1a1a1a; }
        .brand-text p { font-size: 10px; font-weight: 700; color: #007AFF; letter-spacing: 1.5px; text-transform: uppercase; }

        /* ====== SEARCH BAR ====== */
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: #e8e8ed; border-radius: 12px; padding: 10px 14px;
            transition: all 0.2s;
        }
        .search-bar i { color: #8e8e93; font-size: 14px; }
        .search-bar input { border: none; background: transparent; flex: 1; outline: none; font-size: 15px; font-weight: 500; color: #1a1a1a; font-family: 'Inter', sans-serif; }
        .search-bar input::placeholder { color: #8e8e93; }

        /* ====== FILTER CHIPS ====== */
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 4px; scroll-snap-type: x mandatory; }
        .filter-chip {
            flex-shrink: 0; padding: 8px 18px; border-radius: 100px;
            font-size: 13px; font-weight: 600; border: none; cursor: pointer;
            transition: all 0.2s; scroll-snap-align: start;
            background: #e8e8ed; color: #636366;
        }
        .filter-chip.active { background: #1a1a1a; color: #fff; }

        /* ====== MAIN CONTENT ====== */
        .main-content { padding-top: 155px; padding-bottom: 100px; }

        /* ====== SECTION TITLES ====== */
        .section-title {
            padding: 20px 20px 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .section-title h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
        .section-title span { font-size: 13px; font-weight: 600; color: #007AFF; }

        /* ====== FEATURED HORIZONTAL SCROLL ====== */
        .featured-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 0 20px 20px; scroll-snap-type: x mandatory; }
        .featured-card {
            flex-shrink: 0; width: 260px; background: #fff; border-radius: 20px;
            overflow: hidden; scroll-snap-align: start;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .featured-card:active { transform: scale(0.97); }
        .featured-card .card-img { width: 100%; height: 150px; object-fit: cover; background: #e8e8ed; display: block; }
        .featured-card .card-body { padding: 14px 16px 16px; }
        .featured-card .card-body h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.2px; }
        .featured-card .card-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .featured-card .card-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #fff; background: #007AFF; padding: 3px 8px; border-radius: 6px; }
        .featured-card .card-rating { font-size: 11px; color: #8e8e93; font-weight: 600; }
        .featured-card .card-rating i { color: #FF9500; font-size: 10px; margin-right: 2px; }
        .featured-card .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .featured-card .card-price { font-size: 20px; font-weight: 900; color: #1a1a1a; letter-spacing: -0.5px; }
        .featured-card .card-price span { font-size: 12px; font-weight: 500; color: #8e8e93; }
        .featured-card .card-book-btn {
            padding: 8px 18px; border-radius: 10px; border: none;
            background: #1a1a1a; color: white; font-size: 12px;
            font-weight: 700; cursor: pointer; transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .featured-card .card-book-btn:active { transform: scale(0.93); }
        .featured-card .card-book-btn:disabled { background: #d1d1d6; color: #fff; }

        /* ====== COMPACT LIST CARDS ====== */
        .vehicle-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
        .list-card {
            display: flex; gap: 14px; padding: 14px; background: #fff;
            border-radius: 18px; align-items: center;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
            transition: transform 0.15s;
        }
        .list-card:active { transform: scale(0.98); }
        .list-card .lc-img {
            width: 90px; height: 90px; border-radius: 14px; object-fit: cover;
            background: #e8e8ed; flex-shrink: 0; display: block;
        }
        .list-card .lc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .list-card .lc-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-card .lc-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .list-card .lc-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #007AFF; background: #EBF5FF; padding: 3px 8px; border-radius: 6px; }
        .list-card .lc-feat { font-size: 11px; color: #8e8e93; font-weight: 500; }
        .list-card .lc-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .list-card .lc-price { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
        .list-card .lc-price span { font-size: 11px; font-weight: 500; color: #8e8e93; }
        .list-card .lc-book {
            width: 38px; height: 38px; border-radius: 12px; border: none;
            background: #007AFF; color: white; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s; flex-shrink: 0;
        }
        .list-card .lc-book:active { transform: scale(0.88); }
        .list-card .lc-book:disabled { background: #d1d1d6; }
        .list-card .lc-unavail { font-size: 10px; font-weight: 700; color: #FF3B30; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ====== BOTTOM NAV ====== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: rgba(245, 245, 247, 0.9);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-top: 0.5px solid rgba(0,0,0,0.08);
            display: flex; justify-content: space-around; padding: 8px 0 4px;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 16px; text-decoration: none; }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active i, .nav-item.active span { color: #007AFF; }
        .nav-item:not(.active) i, .nav-item:not(.active) span { color: #8e8e93; }

        /* ====== BOOKING BOTTOM SHEET ====== */
        .sheet-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); display: none; opacity: 0; transition: opacity 0.3s; }
        .sheet-overlay.show { opacity: 1; }
        .booking-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
            background: #fff; border-radius: 24px 24px 0 0;
            max-height: 88vh; display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.12);
        }
        .booking-sheet.open { transform: translateY(0); }
        .sheet-handle { width: 36px; height: 4px; background: #d1d1d6; border-radius: 100px; margin: 10px auto 0; flex-shrink: 0; }
        .sheet-header { padding: 16px 20px; display: flex; gap: 14px; align-items: center; border-bottom: 0.5px solid rgba(0,0,0,0.06); flex-shrink: 0; }
        .sheet-header img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; background: #e8e8ed; }
        .sheet-header-info h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 2px; }
        .sheet-header-info .sh-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #007AFF; }
        .sheet-header-info .sh-price { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-top: 4px; }
        .sheet-header-info .sh-price span { color: #8e8e93; font-weight: 500; font-size: 12px; }

        .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #8e8e93; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #e8e8ed; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; color: #1a1a1a; outline: none; transition: border 0.2s; background: #fafafa; }
        .input-group input:focus { border-color: #007AFF; background: #fff; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .date-error { display: none; font-size: 12px; font-weight: 600; color: #FF3B30; background: #FFF0EF; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
        .date-error.show { display: block; }

        /* Receipt */
        .receipt { background: #f5f5f7; border-radius: 18px; padding: 18px; margin: 8px 0 20px; }
        .receipt-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .receipt-row .rr-label { font-size: 13px; font-weight: 500; color: #636366; }
        .receipt-row .rr-value { font-size: 13px; font-weight: 700; color: #1a1a1a; }
        .receipt-divider { height: 0.5px; background: #d1d1d6; margin: 8px 0; }
        .receipt-total .rr-label { font-size: 15px; font-weight: 700; color: #1a1a1a; }
        .receipt-total .rr-value { font-size: 24px; font-weight: 900; color: #007AFF; letter-spacing: -0.5px; }

        .wa-btn {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: #25D366; color: #fff; font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: all 0.15s; box-shadow: 0 4px 16px rgba(37,211,102,0.3);
        }
        .wa-btn:active { transform: scale(0.97); }
        .wa-btn:disabled { background: #d1d1d6; box-shadow: none; }
        .wa-btn i { font-size: 20px; }

        /* ====== SKELETON ====== */
        @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
        .skeleton { background: linear-gradient(90deg, #e8e8ed 25%, #f0f0f3 50%, #e8e8ed 75%); background-size: 400px 100%; animation: shimmer 1.5s infinite linear; border-radius: 14px; }

        /* ====== EMPTY STATE ====== */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 40px; color: #d1d1d6; margin-bottom: 14px; }
        .empty-state h3 { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: #8e8e93; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header safe-top">
        <div class="header-inner">
            <div class="header-brand">
                <div class="brand-icon">B</div>
                <div class="brand-text">
                    <h1>Benaka Travels</h1>
                    <p>Premium Fleet</p>
                </div>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search vehicles..." oninput="filterSearch()">
            </div>
        </div>
    </header>

    <!-- FILTER CHIPS -->
    <div class="filter-scroll" style="position:fixed;top:0;left:0;right:0;z-index:49;background:rgba(245,245,247,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin-top:120px;" id="filter-bar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="SUV">🚙 SUV</button>
        <button class="filter-chip" data-filter="Sedan">🚗 Sedan</button>
        <button class="filter-chip" data-filter="Electric">⚡ Electric</button>
        <button class="filter-chip" data-filter="Luxury">💎 Luxury</button>
        <button class="filter-chip" data-filter="Truck">🛻 Truck</button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <!-- Loader -->
        <div id="loader" style="padding:0 20px;">
            <div class="skeleton" style="width:100%;height:100px;margin-bottom:12px;"></div>
            <div class="skeleton" style="width:100%;height:100px;margin-bottom:12px;"></div>
            <div class="skeleton" style="width:100%;height:100px;margin-bottom:12px;"></div>
        </div>

        <!-- Featured Section (horizontal scroll) -->
        <div id="featured-section" style="display:none;">
            <div class="section-title">
                <h2>🔥 Featured</h2>
                <span id="vehicle-count">0 vehicles</span>
            </div>
            <div class="featured-scroll" id="featured-scroll"></div>
        </div>

        <!-- All Vehicles list -->
        <div id="all-section" style="display:none;">
            <div class="section-title">
                <h2>All Vehicles</h2>
            </div>
            <div class="vehicle-list" id="vehicle-list"></div>
        </div>

        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="fa-solid fa-car-burst"></i>
            <h3>No vehicles found</h3>
            <p>Try a different category or search term</p>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav safe-bottom">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-compass"></i>
            <span>Explore</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Activity</span>
        </a>
        <a href="/admin.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Admin</span>
        </a>
    </nav>

    <!-- BOOKING SHEET -->
    <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
    <div class="booking-sheet" id="booking-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <img id="sh-img" src="">
            <div class="sheet-header-info">
                <div class="sh-tag" id="sh-type">SUV</div>
                <h3 id="sh-name">Vehicle</h3>
                <div class="sh-price">₹<span id="sh-rate" style="color:#1a1a1a;font-weight:800;">0</span> <span>/ day</span></div>
            </div>
        </div>
        <div class="sheet-body">
            <form id="booking-form" onsubmit="submitBooking(event)">
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" id="cust-name" required placeholder="Full name">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Pick-up Date</label>
                        <input type="date" id="start-date" required>
                    </div>
                    <div class="input-group">
                        <label>Drop-off Date</label>
                        <input type="date" id="end-date" required>
                    </div>
                </div>
                <div class="date-error" id="date-error">Drop-off date must be after pick-up date</div>

                <div class="receipt">
                    <div class="receipt-row"><span class="rr-label">Rate</span><span class="rr-value">₹<span id="r-rate">0</span>/day</span></div>
                    <div class="receipt-row"><span class="rr-label">Duration</span><span class="rr-value" id="r-days">0 days</span></div>
                    <div class="receipt-divider"></div>
                    <div class="receipt-row receipt-total"><span class="rr-label">Total</span><span class="rr-value">₹<span id="r-total">0</span></span></div>
                </div>

                <button type="submit" class="wa-btn" id="wa-btn" disabled>
                    <i class="fa-brands fa-whatsapp"></i> Book via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        const WA_NUM = "919876543210";
        let allVehicles = [], currentVehicle = null, currentFilter = 'all', searchTerm = '';

        document.addEventListener('DOMContentLoaded', () => {
            fetchVehicles();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').min = today;
            document.getElementById('end-date').min = today;
            ['start-date','end-date','cust-name'].forEach(id => document.getElementById(id).addEventListener('input', calc));

            document.querySelectorAll('.filter-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    render();
                });
            });
        });

        async function fetchVehicles() {
            try {
                const res = await fetch('/api/vehicles');
                const d = await res.json();
                document.getElementById('loader').style.display = 'none';
                if(d.success) { allVehicles = d.data; render(); }
            } catch(e) { document.getElementById('loader').style.display = 'none'; }
        }

        function filterSearch() {
            searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            render();
        }

        function getFiltered() {
            let v = allVehicles;
            if(currentFilter !== 'all') v = v.filter(x => x.type === currentFilter);
            if(searchTerm) v = v.filter(x => x.name.toLowerCase().includes(searchTerm) || (x.description||'').toLowerCase().includes(searchTerm));
            return v;
        }

        function render() {
            const vehicles = getFiltered();
            const featuredEl = document.getElementById('featured-section');
            const allEl = document.getElementById('all-section');
            const emptyEl = document.getElementById('empty-state');

            if(vehicles.length === 0) {
                featuredEl.style.display = 'none'; allEl.style.display = 'none'; emptyEl.style.display = 'block'; return;
            }
            emptyEl.style.display = 'none';

            // Featured = first 4 available
            const featured = vehicles.filter(v => v.is_available === 1 || v.is_available === true).slice(0, 4);
            const fScroll = document.getElementById('featured-scroll');
            document.getElementById('vehicle-count').textContent = vehicles.length + ' vehicle' + (vehicles.length !== 1 ? 's' : '');

            if(featured.length > 0) {
                featuredEl.style.display = 'block';
                fScroll.innerHTML = featured.map(v => {
                    let feats = '';
                    try { feats = JSON.parse(v.features || '[]').slice(0,2).join(' · '); } catch(e){}
                    return `
                    <div class="featured-card">
                        <img class="card-img" src="${v.image_url}" onerror="this.src='https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=600'" loading="lazy">
                        <div class="card-body">
                            <div class="card-meta">
                                <span class="card-tag">${v.type}</span>
                                <span class="card-rating"><i class="fa-solid fa-star"></i> ${(4 + Math.random()).toFixed(1)}</span>
                            </div>
                            <h3>${v.name}</h3>
                            <div class="card-footer">
                                <div class="card-price">₹${v.daily_rate}<span>/day</span></div>
                                <button class="card-book-btn" onclick='openSheet(${JSON.stringify(v).replace(/'/g,"&#39;")})'>Book</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } else { featuredEl.style.display = 'none'; }

            // All vehicles compact list
            allEl.style.display = 'block';
            const listEl = document.getElementById('vehicle-list');
            listEl.innerHTML = vehicles.map(v => {
                const avail = v.is_available === 1 || v.is_available === true;
                let feats = '';
                try { feats = JSON.parse(v.features || '[]').slice(0,3).join(' · '); } catch(e){}
                return `
                <div class="list-card" onclick="${avail ? `openSheet(${JSON.stringify(v).replace(/'/g,"&#39;")})` : ''}">
                    <img class="lc-img" src="${v.image_url}" onerror="this.src='https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=300'" loading="lazy">
                    <div class="lc-info">
                        <div class="lc-name">${v.name}</div>
                        <div class="lc-tags">
                            <span class="lc-type">${v.type}</span>
                            ${feats ? `<span class="lc-feat">${feats}</span>` : ''}
                        </div>
                        <div class="lc-bottom">
                            <div class="lc-price">₹${v.daily_rate}<span>/day</span></div>
                            ${!avail ? '<span class="lc-unavail">Rented Out</span>' : ''}
                        </div>
                    </div>
                    ${avail ? `<button class="lc-book" onclick="event.stopPropagation();openSheet(${JSON.stringify(v).replace(/'/g,"&#39;")})"><i class="fa-solid fa-arrow-right"></i></button>` : ''}
                </div>`;
            }).join('');
        }

        function openSheet(v) {
            currentVehicle = v;
            document.getElementById('sh-name').textContent = v.name;
            document.getElementById('sh-type').textContent = v.type;
            document.getElementById('sh-img').src = v.image_url;
            document.getElementById('sh-rate').textContent = v.daily_rate;
            document.getElementById('r-rate').textContent = v.daily_rate;
            document.getElementById('booking-form').reset();
            calc();

            document.getElementById('sheet-overlay').style.display = 'block';
            requestAnimationFrame(() => {
                document.getElementById('sheet-overlay').classList.add('show');
                document.getElementById('booking-sheet').classList.add('open');
            });
        }

        function closeSheet() {
            document.getElementById('sheet-overlay').classList.remove('show');
            document.getElementById('booking-sheet').classList.remove('open');
            setTimeout(() => document.getElementById('sheet-overlay').style.display = 'none', 350);
        }

        function calc() {
            const s = document.getElementById('start-date').value, e = document.getElementById('end-date').value;
            const n = document.getElementById('cust-name').value.trim(), btn = document.getElementById('wa-btn');
            const err = document.getElementById('date-error');
            if(!s || !e) { document.getElementById('r-days').textContent = '0 days'; document.getElementById('r-total').textContent = '0'; btn.disabled = true; return; }
            const days = Math.ceil((new Date(e) - new Date(s)) / 86400000) + 1;
            if(days <= 0) { err.classList.add('show'); btn.disabled = true; return; }
            err.classList.remove('show');
            document.getElementById('r-days').textContent = days + ' day' + (days>1?'s':'');
            document.getElementById('r-total').textContent = (days * currentVehicle.daily_rate).toLocaleString();
            btn.disabled = n.length === 0;
        }

        async function submitBooking(ev) {
            ev.preventDefault();
            const btn = document.getElementById('wa-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...'; btn.disabled = true;
            const payload = {
                vehicle_id: currentVehicle.id, customer_name: document.getElementById('cust-name').value,
                customer_phone: 'WhatsApp', start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                total_price: parseInt(document.getElementById('r-total').textContent.replace(/,/g,''))
            };
            try {
                await fetch('/api/bookings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                const msg = `*Benaka Travels Booking*\n\nVehicle: ${currentVehicle.name}\nGuest: ${payload.customer_name}\nDates: ${payload.start_date} → ${payload.end_date}\nTotal: ₹${payload.total_price}\n\nPlease confirm!`;
                closeSheet();
                window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
            } catch(e) { alert('Network error'); }
            btn.innerHTML = '<i class="fa-brands fa-whatsapp"></i> Book via WhatsApp'; btn.disabled = false;
        }

        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
