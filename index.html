<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Benaka Travels - Premium Rentals</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/benaka_travels_logo.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7', // Benaka Primary Blue
                            900: '#0c4a6e',
                        },
                        dark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; -webkit-tap-highlight-color: transparent; }
        
        /* Hide scrollbar for clean app look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Safe Area Paddings for iOS */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 40px); }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .bottom-sheet.closed { transform: translateY(105%); }
        .bottom-sheet.open { transform: translateY(0); }
        
        /* Input styling native feel */
        input[type="date"], input[type="text"] {
            appearance: none; -webkit-appearance: none;
        }
    </style>
</head>

<body class="text-slate-800 antialiased relative min-h-screen pb-[90px]">
    
    <!-- App Header (Top Bar) -->
    <header class="fixed top-0 inset-x-0 z-40 glass-panel safe-pt px-5 pb-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/30 text-white font-bold text-xl">
                B
            </div>
            <div>
                <h1 class="font-extrabold text-lg leading-tight tracking-tight text-slate-900">Benaka Travels</h1>
                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Premium Fleet</p>
            </div>
        </div>
        <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:scale-95 transition-transform">
            <i class="fa-solid fa-bell"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="pt-[110px] px-4">
        <!-- Search & Filter Bar -->
        <div class="mb-6 flex gap-3 overflow-x-auto pb-2 scroll-smooth filter-bar">
            <!-- Active pill -->
            <button class="shrink-0 px-5 py-2.5 rounded-full bg-slate-900 text-white font-semibold text-sm shadow-md transition-transform active:scale-95" data-filter="all">All Vehicles</button>
            <button class="shrink-0 px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-semibold text-sm transition-transform active:scale-95" data-filter="SUV">SUV</button>
            <button class="shrink-0 px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-semibold text-sm transition-transform active:scale-95" data-filter="Sedan">Sedan</button>
            <button class="shrink-0 px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-semibold text-sm transition-transform active:scale-95" data-filter="Electric">Electric</button>
        </div>

        <!-- Vehicles Feed -->
        <div id="loading" class="space-y-6">
            <!-- Skeleton Card -->
            <div class="bg-white rounded-[24px] p-2 shadow-sm border border-slate-100 animate-pulse">
                <div class="w-full h-56 bg-slate-200 rounded-[18px]"></div>
                <div class="p-4 space-y-3">
                    <div class="h-6 bg-slate-200 rounded w-1/2"></div>
                    <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                </div>
            </div>
        </div>

        <div id="vehicles-grid" class="flex flex-col gap-6 hidden">
            <!-- Injected by JS -->
        </div>

        <div id="no-results" class="hidden text-center py-16">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4 text-slate-400 text-2xl">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-lg">No vehicles found</h3>
            <p class="text-sm text-slate-500 mt-1">Try selecting a different category.</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 safe-pb z-40 pb-2 pt-3 px-6 flex justify-around shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
        <a href="#" class="flex flex-col items-center gap-1 text-brand-600">
            <i class="fa-solid fa-compass text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Explore</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-800 transition-colors">
            <i class="fa-solid fa-ticket text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Bookings</span>
        </a>
        <a href="/admin.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-800 transition-colors">
            <i class="fa-solid fa-shield-halved text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Admin</span>
        </a>
    </nav>

    <!-- Full Screen Action Sheet (Booking Modal) -->
    <div id="booking-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="booking-sheet" class="fixed bottom-0 inset-x-0 z-50 bg-white rounded-t-[32px] shadow-2xl bottom-sheet closed flex flex-col max-h-[90vh]">
        <!-- Drag Handle -->
        <div class="w-full h-8 flex items-center justify-center cursor-ns-resize shrink-0 pt-2" onclick="closeSheet()">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="px-6 pb-6 overflow-y-auto safe-pb flex-1 no-scrollbar">
            <!-- Header Info -->
            <div class="flex gap-4 items-center mb-6">
                <div class="w-24 h-24 shrink-0 rounded-2xl bg-slate-100 border border-slate-200 overflow-hidden relative shadow-inner">
                    <img id="sheet-img" src="" class="w-full h-full object-cover">
                </div>
                <div>
                    <div class="inline-block px-2 py-1 bg-brand-50 text-brand-600 text-[10px] font-extrabold uppercase tracking-wider rounded border border-brand-100 mb-1" id="sheet-type">SUV</div>
                    <h2 id="sheet-title" class="text-xl font-extrabold text-slate-900 leading-tight">Car Name</h2>
                    <p class="text-sm text-slate-500 font-medium mt-1">₹<span id="sheet-rate">0</span> / day</p>
                </div>
            </div>

            <form id="booking-form" class="space-y-5">
                <!-- Name -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Guest Name</label>
                    <div class="relative relative flex items-center">
                        <i class="fa-regular fa-user absolute left-4 text-slate-400"></i>
                        <input type="text" id="cust-name" required placeholder="Enter full name" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-base rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block pl-11 p-4 font-medium transition-shadow placeholder:font-normal">
                    </div>
                </div>

                <!-- Dates Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Pick-up</label>
                        <input type="date" id="start-date" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-brand-500 block p-3.5 font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Drop-off</label>
                        <input type="date" id="end-date" required class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-brand-500 block p-3.5 font-semibold">
                    </div>
                </div>

                <p id="date-error" class="hidden text-red-500 text-xs font-bold bg-red-50 p-3 rounded-lg border border-red-100">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Drop-off must be after pick-up date.
                </p>

                <!-- Receipt UI -->
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 mt-2 shadow-inner">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Booking Summary</h4>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-slate-600 font-medium text-sm">Rate</span>
                        <span class="text-slate-800 font-bold text-sm">₹<span id="calc-rate">0</span>/day</span>
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-slate-600 font-medium text-sm">Duration</span>
                        <span class="text-slate-800 font-bold text-sm" id="calc-days">0 Days</span>
                    </div>
                    <div class="pt-3 border-t border-slate-200/80 flex justify-between items-end">
                        <span class="text-slate-900 font-extrabold text-base">Estimated Total</span>
                        <span class="text-brand-600 font-extrabold text-2xl">₹<span id="calc-total">0</span></span>
                    </div>
                </div>

                <button type="submit" id="whatsapp-btn" disabled class="w-full bg-[#25D366] text-white font-bold text-lg p-4 rounded-2xl shadow-lg shadow-[#25D366]/30 disabled:opacity-40 disabled:scale-100 flex items-center justify-center gap-2 transition-all active:scale-95">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> Request via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- UI Scripts -->
    <script>
        const WHATSAPP_NUMBER = "919876543210"; // Placeholder for Client's Number
        let allVehicles = [];
        let currentVehicle = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchVehicles();

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').min = today;
            document.getElementById('end-date').min = today;

            // Real-time calculations
            ['start-date', 'end-date', 'cust-name'].forEach(id => {
                document.getElementById(id).addEventListener('input', calculateTotal);
            });

            // Filter logic
            const filterBtns = document.querySelectorAll('.filter-bar button');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-slate-900', 'text-white');
                        b.classList.add('bg-white', 'text-slate-600');
                    });
                    e.target.classList.remove('bg-white', 'text-slate-600');
                    e.target.classList.add('bg-slate-900', 'text-white');

                    const filter = e.target.dataset.filter;
                    renderFeed(filter === 'all' ? allVehicles : allVehicles.filter(v => v.type === filter));
                });
            });

            // Close sheet on overlay tap
            document.getElementById('booking-overlay').addEventListener('click', closeSheet);
        });

        async function fetchVehicles() {
            try {
                const res = await fetch('/api/vehicles');
                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');
                if (data.success) {
                    allVehicles = data.data;
                    renderFeed(allVehicles);
                }
            } catch (err) { }
        }

        function renderFeed(vehicles) {
            const grid = document.getElementById('vehicles-grid');
            const noRes = document.getElementById('no-results');
            grid.innerHTML = '';

            if (vehicles.length === 0) {
                grid.classList.add('hidden');
                noRes.classList.remove('hidden'); return;
            }

            grid.classList.remove('hidden');
            noRes.classList.add('hidden');

            vehicles.forEach((v, i) => {
                const isAvail = v.is_available === 1 || v.is_available === true;
                
                // Features
                let featStr = '';
                try {
                    const feats = JSON.parse(v.features || '[]');
                    featStr = feats.slice(0,3).join(' • ');
                } catch(e) {}

                grid.innerHTML += `
                    <div class="bg-white rounded-[24px] p-2 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 animate-slide-up" style="animation-delay: ${i * 0.05}s">
                        <div class="relative w-full h-64 rounded-[18px] overflow-hidden bg-slate-100 group">
                            <img src="${v.image_url}" class="w-full h-full object-cover group-active:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=800'">
                            ${!isAvail ? '<div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-10"><span class="bg-white text-slate-900 text-xs font-black uppercase tracking-widest px-4 py-2 rounded-full shadow-xl">Rented</span></div>' : ''}
                            <div class="absolute top-4 right-4 glass-panel px-3 py-1.5 rounded-full z-0 flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                                <span class="text-xs font-bold text-slate-800">New</span>
                            </div>
                        </div>
                        <div class="p-4 pt-5 relative">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-xl font-extrabold text-slate-900 tracking-tight leading-none mb-1">${v.name}</h3>
                                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${featStr}</p>
                                </div>
                                <div class="text-right">
                                    <div class="text-xl font-black text-brand-600">₹${v.daily_rate}</div>
                                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Per Day</div>
                                </div>
                            </div>
                            <button onclick='openSheet(${JSON.stringify(v).replace(/'/g, "&#39;")})' 
                                class="mt-5 w-full py-4 rounded-xl font-bold transition-all active:scale-95 flex items-center justify-center text-[15px]
                                ${isAvail ? 'bg-slate-900 text-white shadow-xl shadow-slate-900/20' : 'bg-slate-100 text-slate-400'}" 
                                ${!isAvail ? 'disabled' : ''}>
                                ${isAvail ? 'Reserve Vehicle' : 'Currently Unavailable'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openSheet(vehicle) {
            currentVehicle = vehicle;
            document.getElementById('sheet-title').textContent = vehicle.name;
            document.getElementById('sheet-type').textContent = vehicle.type;
            document.getElementById('sheet-img').src = vehicle.image_url;
            document.getElementById('sheet-rate').textContent = vehicle.daily_rate;
            document.getElementById('calc-rate').textContent = vehicle.daily_rate;
            
            // Reset
            document.getElementById('booking-form').reset();
            calculateTotal();

            // Animate In
            const overlay = document.getElementById('booking-overlay');
            const sheet = document.getElementById('booking-sheet');
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('closed');
                sheet.classList.add('open');
            }, 10);
        }

        function closeSheet() {
            const overlay = document.getElementById('booking-overlay');
            const sheet = document.getElementById('booking-sheet');
            
            overlay.classList.add('opacity-0');
            sheet.classList.remove('open');
            sheet.classList.add('closed');
            
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function calculateTotal() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            const name = document.getElementById('cust-name').value.trim();
            const btn = document.getElementById('whatsapp-btn');
            const err = document.getElementById('date-error');

            if(!start || !end) {
                document.getElementById('calc-days').textContent = '0 Days';
                document.getElementById('calc-total').textContent = '0';
                btn.disabled = true; return;
            }

            const d1 = new Date(start); const d2 = new Date(end);
            const days = Math.ceil((d2 - d1) / (1000*60*60*24)) + 1;

            if(days <= 0) {
                err.classList.remove('hidden'); btn.disabled = true;
            } else {
                err.classList.add('hidden');
                document.getElementById('calc-days').textContent = `${days} Day${days>1?'s':''}`;
                document.getElementById('calc-total').textContent = (days * currentVehicle.daily_rate).toLocaleString();
                btn.disabled = name.length === 0;
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('whatsapp-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Securing...';
            
            const payload = {
                vehicle_id: currentVehicle.id,
                customer_name: document.getElementById('cust-name').value,
                customer_phone: "WhatsApp App", // Handled by WA
                start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                total_price: parseInt(document.getElementById('calc-total').textContent.replace(/,/g,''))
            };

            try {
                const res = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                // Generate WA Intent
                const msg = `*Benaka Travels Reservation Request* 🚗\n\n*Vehicle:* ${currentVehicle.name}\n*Guest:* ${payload.customer_name}\n*Dates:* ${payload.start_date} to ${payload.end_date}\n*Estimated Total:* ₹${payload.total_price}\n\nPlease confirm my booking!`;
                
                closeSheet();
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-brands fa-whatsapp text-2xl"></i> Request via WhatsApp';
                }, 1000);
            } catch (err) {
                alert("Connection failed. Please check internet.");
                btn.innerHTML = '<i class="fa-brands fa-whatsapp text-2xl"></i> Request via WhatsApp';
            }
        });

        // PWA
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
