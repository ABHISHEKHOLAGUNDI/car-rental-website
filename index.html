<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Benaka Travels - Elite Fleet</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/benaka_travels_logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0c',
                        surface: '#121216',
                        brand: { 500: '#3b82f6', 600: '#2563eb' },
                        accent: '#f8fafc'
                    },
                    fontFamily: { sans: ['"Outfit"', 'sans-serif'] },
                    animation: { 'fade-up': 'fadeUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards' },
                    keyframes: { fadeUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } } }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050505; color: #fff; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        .glass-header { background: rgba(5, 5, 5, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-pill { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-sheet { background: rgba(18, 18, 22, 0.95); backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.1); }
        
        /* Floating App Nav */
        .app-nav { position: fixed; bottom: env(safe-area-inset-bottom, 24px); left: 50%; transform: translateX(-50%); z-index: 40; }
        
        /* Cinematic Image Mask */
        .cinematic-mask { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%); }
        
        .bottom-sheet { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
        .bottom-sheet.closed { transform: translateY(100%); }
        .bottom-sheet.open { transform: translateY(0); }
        
        input[type="date"], input[type="text"] { background: rgba(255,255,255,0.05); color: white !important; border: 1px solid rgba(255,255,255,0.1); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>

<body class="antialiased min-h-screen pb-32">

    <!-- Ambient Glow Background -->
    <div class="fixed top-0 left-0 w-full h-96 bg-brand-600/20 blur-[120px] pointer-events-none rounded-full transform -translate-y-1/2"></div>

    <!-- Header -->
    <header class="fixed top-0 inset-x-0 z-40 glass-header pt-[env(safe-area-inset-top,40px)] px-6 pb-4 flex justify-between items-center">
        <div>
            <h1 class="font-black text-2xl tracking-tight text-white leading-none">Benaka</h1>
            <p class="text-[10px] font-bold text-brand-500 uppercase tracking-[0.3em] mt-1">Elite Travels</p>
        </div>
        <div class="w-10 h-10 rounded-full glass-pill flex items-center justify-center relative shadow-[0_0_20px_rgba(255,255,255,0.05)] text-white/80">
            <i class="fa-solid fa-bell"></i>
            <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full animate-pulse border border-[#050505]"></span>
        </div>
    </header>

    <main class="pt-[110px] px-5 relative z-10">
        
        <!-- Hero Text -->
        <div class="mb-8 mt-2 animate-fade-up">
            <h2 class="text-4xl font-black leading-[1.1] tracking-tight">Experience<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-blue-300">Pure Luxury.</span></h2>
            <p class="text-white/50 text-sm mt-3 font-medium max-w-[280px]">Reserve your elite vehicle today and command the road.</p>
        </div>

        <!-- Filter Categories -->
        <div class="mb-8 flex gap-4 overflow-x-auto no-scrollbar scroll-smooth filter-bar pb-2">
            <button class="shrink-0 flex flex-col items-center gap-2 group transition-all" data-filter="all">
                <div class="w-14 h-14 rounded-[20px] bg-white flex items-center justify-center text-dark shadow-[0_0_20px_rgba(255,255,255,0.2)] transition-transform active:scale-95 group-data-[active=true]:bg-white group-data-[active=true]:text-dark group-data-[active=false]:bg-surface group-data-[active=false]:border group-data-[active=false]:border-white/10 group-data-[active=false]:text-white/50">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-white">All</span>
            </button>
            <button class="shrink-0 flex flex-col items-center gap-2 group transition-all" data-filter="SUV">
                <div class="w-14 h-14 rounded-[20px] bg-surface border border-white/10 flex items-center justify-center text-white/50 transition-transform active:scale-95 group-data-[active=true]:bg-white group-data-[active=true]:text-dark">
                    <i class="fa-solid fa-truck-monster text-xl"></i>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-white/50 group-data-[active=true]:text-white">SUV</span>
            </button>
            <button class="shrink-0 flex flex-col items-center gap-2 group transition-all" data-filter="Sedan">
                <div class="w-14 h-14 rounded-[20px] bg-surface border border-white/10 flex items-center justify-center text-white/50 transition-transform active:scale-95 group-data-[active=true]:bg-white group-data-[active=true]:text-dark">
                    <i class="fa-solid fa-car-side text-xl"></i>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-white/50 group-data-[active=true]:text-white">Sedan</span>
            </button>
            <button class="shrink-0 flex flex-col items-center gap-2 group transition-all" data-filter="Electric">
                <div class="w-14 h-14 rounded-[20px] bg-surface border border-white/10 flex items-center justify-center text-white/50 transition-transform active:scale-95 group-data-[active=true]:bg-brand-500 group-data-[active=true]:text-white group-data-[active=true]:border-brand-500 group-data-[active=true]:shadow-[0_0_20px_rgba(59,130,246,0.4)]">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-white/50 group-data-[active=true]:text-white">EV</span>
            </button>
        </div>

        <!-- Feed Loader -->
        <div id="loading" class="flex justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
        </div>

        <!-- Vehicles Grid (Cinematic Cards) -->
        <div id="vehicles-grid" class="flex flex-col gap-8 hidden">
            <!-- Injected by JS -->
        </div>

        <div id="no-results" class="hidden text-center py-20">
            <i class="fa-solid fa-car-tunnel text-4xl text-white/20 mb-4"></i>
            <h3 class="font-bold text-white text-lg">No vehicles found</h3>
            <p class="text-sm text-white/40 mt-1">Try another category</p>
        </div>
    </main>

    <!-- Floating Pill Navigation -->
    <nav class="app-nav glass-pill rounded-full px-6 py-4 flex gap-8 items-center shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
        <a href="#" class="flex flex-col items-center gap-1 text-white">
            <i class="fa-solid fa-compass text-xl"></i>
        </a>
        <div class="w-px h-6 bg-white/10"></div>
        <a href="#" class="flex flex-col items-center gap-1 text-white/40 hover:text-white transition-colors">
            <i class="fa-solid fa-ticket text-xl"></i>
        </a>
        <div class="w-px h-6 bg-white/10"></div>
        <a href="/admin.html" class="flex flex-col items-center gap-1 text-white/40 hover:text-white transition-colors">
            <i class="fa-solid fa-shield-halved text-xl"></i>
        </a>
    </nav>

    <!-- Elite Booking Bottom Sheet -->
    <div id="booking-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="booking-sheet" class="fixed bottom-0 inset-x-0 z-50 glass-sheet rounded-t-[40px] shadow-[0_-20px_60px_rgba(0,0,0,0.4)] bottom-sheet closed flex flex-col max-h-[90vh]">
        <!-- Drag Handle -->
        <div class="w-full h-8 flex items-center justify-center cursor-ns-resize shrink-0 pt-3" onclick="closeSheet()">
            <div class="w-16 h-1 bg-white/20 rounded-full"></div>
        </div>

        <div class="px-6 pb-6 overflow-y-auto safe-pb flex-1 no-scrollbar pt-2">
            <!-- Header Image Banner inside sheet -->
            <div class="w-full h-48 rounded-[24px] overflow-hidden relative mb-6">
                <img id="sheet-img" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 cinematic-mask flex flex-col justify-end p-5">
                    <div class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md text-white text-[10px] font-bold uppercase tracking-widest rounded-full w-max mb-1" id="sheet-type">SUV</div>
                    <h2 id="sheet-title" class="text-3xl font-black text-white leading-tight tracking-tight">Car Name</h2>
                </div>
            </div>

            <form id="booking-form" class="space-y-5">
                <!-- Name -->
                <div>
                    <label class="block text-[10px] font-bold text-white/50 uppercase tracking-[0.2em] mb-2 px-1">Guest Name</label>
                    <input type="text" id="cust-name" required placeholder="Full Name" class="w-full rounded-[16px] p-4 text-base font-medium focus:ring-1 focus:ring-brand-500 outline-none placeholder:text-white/20 transition-all">
                </div>

                <!-- Dates Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-white/50 uppercase tracking-[0.2em] mb-2 px-1">Pick-up</label>
                        <input type="date" id="start-date" required class="w-full rounded-[16px] p-4 text-sm font-medium focus:ring-1 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-white/50 uppercase tracking-[0.2em] mb-2 px-1">Drop-off</label>
                        <input type="date" id="end-date" required class="w-full rounded-[16px] p-4 text-sm font-medium focus:ring-1 focus:ring-brand-500 outline-none">
                    </div>
                </div>

                <p id="date-error" class="hidden text-red-400 text-xs font-bold bg-red-950/30 p-3 rounded-[12px] border border-red-500/20 text-center">
                    Check-out date must be after Check-in.
                </p>

                <!-- Cinematic Receipt UI -->
                <div class="bg-black/40 border border-white/5 rounded-[24px] p-5 mt-4">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-white/60 font-medium text-sm">Daily Rate</span>
                        <span class="text-white font-bold text-sm">₹<span id="calc-rate">0</span></span>
                    </div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-white/60 font-medium text-sm">Duration</span>
                        <span class="text-white font-bold text-sm" id="calc-days">0 Days</span>
                    </div>
                    <div class="w-full h-px bg-white/10 mb-4"></div>
                    <div class="flex justify-between items-end">
                        <span class="text-white/80 font-bold text-sm uppercase tracking-wider">Total</span>
                        <span class="text-white font-black text-3xl tracking-tight">₹<span id="calc-total">0</span></span>
                    </div>
                </div>

                <button type="submit" id="whatsapp-btn" disabled class="w-full bg-[#128C7E] text-white font-black tracking-wide text-lg py-5 rounded-[20px] shadow-[0_10px_30px_rgba(18,140,126,0.3)] disabled:opacity-30 disabled:scale-100 disabled:shadow-none flex items-center justify-center gap-2 transition-all active:scale-[0.98] mt-2">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> REQUEST RESERVATION
                </button>
            </form>
        </div>
    </div>

    <!-- UI Scripts -->
    <script>
        const WHATSAPP_NUMBER = "919876543210"; 
        let allVehicles = [];
        let currentVehicle = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchVehicles();
            
            // Set initial active filter
            document.querySelector('[data-filter="all"]').dataset.active = "true";

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').min = today;
            document.getElementById('end-date').min = today;

            // Calculations
            ['start-date', 'end-date', 'cust-name'].forEach(id => {
                document.getElementById(id).addEventListener('input', calculateTotal);
            });

            // Filters
            const filterBtns = document.querySelectorAll('.filter-bar button');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    filterBtns.forEach(b => b.dataset.active = "false");
                    target.dataset.active = "true";

                    const filter = target.dataset.filter;
                    renderFeed(filter === 'all' ? allVehicles : allVehicles.filter(v => v.type === filter));
                });
            });

            document.getElementById('booking-overlay').addEventListener('click', closeSheet);
        });

        async function fetchVehicles() {
            try {
                const res = await fetch('/api/vehicles');
                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');
                if (data.success) {
                    allVehicles = data.data;
                    renderFeed(allVehicles);
                }
            } catch (err) { }
        }

        function renderFeed(vehicles) {
            const grid = document.getElementById('vehicles-grid');
            const noRes = document.getElementById('no-results');
            grid.innerHTML = '';

            if (vehicles.length === 0) {
                grid.classList.add('hidden');
                noRes.classList.remove('hidden'); return;
            }

            grid.classList.remove('hidden');
            noRes.classList.add('hidden');

            vehicles.forEach((v, i) => {
                const isAvail = v.is_available === 1 || v.is_available === true;
                
                grid.innerHTML += `
                    <div class="w-full relative rounded-[32px] overflow-hidden bg-surface shadow-[0_20px_40px_rgba(0,0,0,0.5)] border border-white/5 animate-fade-up" style="animation-delay: ${i * 0.1}s; height: 420px;">
                        <!-- Full Background Image -->
                        <img src="${v.image_url}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 hover:scale-105" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1617469767053-d3b523a0b982?w=800'">
                        
                        <!-- Top Tags -->
                        <div class="absolute top-5 inset-x-5 flex justify-between items-center z-10">
                            <span class="glass-pill px-4 py-1.5 rounded-full text-[10px] font-bold text-white uppercase tracking-widest">${v.type}</span>
                            ${!isAvail ? '<span class="bg-red-500/90 backdrop-blur text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg">Rented</span>' : ''}
                        </div>

                        <!-- Bottom Content Gradient -->
                        <div class="absolute inset-0 cinematic-mask pointer-events-none"></div>

                        <!-- Info & Action -->
                        <div class="absolute bottom-0 inset-x-0 p-6 z-20 flex flex-col justify-end">
                            <h3 class="text-3xl font-black text-white tracking-tight leading-none mb-2">${v.name}</h3>
                            <div class="flex justify-between items-end mb-5">
                                <p class="text-white/70 text-sm font-medium line-clamp-2 pr-4">${v.description || 'Premium vehicle tailored for absolute comfort.'}</p>
                                <div class="text-right shrink-0 relative top-1">
                                    <div class="text-xs font-bold text-brand-400 uppercase tracking-widest mb-1">Per Day</div>
                                    <div class="text-3xl font-black text-white leading-none">₹${v.daily_rate}</div>
                                </div>
                            </div>
                            
                            <button onclick='openSheet(${JSON.stringify(v).replace(/'/g, "&#39;")})' 
                                class="w-full py-4 rounded-[16px] font-bold tracking-wide transition-all active:scale-[0.98]
                                ${isAvail ? 'bg-white text-dark shadow-[0_0_30px_rgba(255,255,255,0.2)]' : 'bg-white/10 text-white/30 backdrop-blur-md'}" 
                                ${!isAvail ? 'disabled' : ''}>
                                ${isAvail ? 'RESERVE NOW' : 'NOT AVAILABLE'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openSheet(vehicle) {
            currentVehicle = vehicle;
            document.getElementById('sheet-title').textContent = vehicle.name;
            document.getElementById('sheet-type').textContent = vehicle.type;
            document.getElementById('sheet-img').src = vehicle.image_url;
            document.getElementById('sheet-rate').textContent = vehicle.daily_rate;
            document.getElementById('calc-rate').textContent = vehicle.daily_rate;
            
            document.getElementById('booking-form').reset();
            calculateTotal();

            const overlay = document.getElementById('booking-overlay');
            const sheet = document.getElementById('booking-sheet');
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('closed');
                sheet.classList.add('open');
            }, 10);
        }

        function closeSheet() {
            const overlay = document.getElementById('booking-overlay');
            const sheet = document.getElementById('booking-sheet');
            
            overlay.classList.add('opacity-0');
            sheet.classList.remove('open');
            sheet.classList.add('closed');
            
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function calculateTotal() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            const name = document.getElementById('cust-name').value.trim();
            const btn = document.getElementById('whatsapp-btn');
            const err = document.getElementById('date-error');

            if(!start || !end) {
                document.getElementById('calc-days').textContent = '0 Days';
                document.getElementById('calc-total').textContent = '0';
                btn.disabled = true; return;
            }

            const d1 = new Date(start); const d2 = new Date(end);
            const days = Math.ceil((d2 - d1) / (1000*60*60*24)) + 1;

            if(days <= 0) {
                err.classList.remove('hidden'); btn.disabled = true;
            } else {
                err.classList.add('hidden');
                document.getElementById('calc-days').textContent = `${days} Day${days>1?'s':''}`;
                document.getElementById('calc-total').textContent = (days * currentVehicle.daily_rate).toLocaleString();
                btn.disabled = name.length === 0;
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('whatsapp-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...';
            
            const payload = {
                vehicle_id: currentVehicle.id,
                customer_name: document.getElementById('cust-name').value,
                customer_phone: "WhatsApp App",
                start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                total_price: parseInt(document.getElementById('calc-total').textContent.replace(/,/g,''))
            };

            try {
                await fetch('/api/bookings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const msg = `*Elite Reservation Request* 🍾\n\n*Vehicle:* ${currentVehicle.name}\n*Guest:* ${payload.customer_name}\n*Dates:* ${payload.start_date} to ${payload.end_date}\n*Total Expected:* ₹${payload.total_price}\n\nPlease confirm!`;
                
                closeSheet();
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
                btn.innerHTML = '<i class="fa-brands fa-whatsapp text-2xl"></i> REQUEST RESERVATION';
            } catch (err) {
                alert("Network Error.");
                btn.innerHTML = '<i class="fa-brands fa-whatsapp text-2xl"></i> REQUEST RESERVATION';
            }
        });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
