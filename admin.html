<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Benaka Elite - Admin</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/benaka_travels_logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050505',
                        surface: '#0d0d10',
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: { sans: ['"Outfit"', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050505; color: #fff; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 40px); }
        
        .glass-header { background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.03); }
        .glass-pill { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-card { background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-sheet { background: rgba(13, 13, 16, 0.95); backdrop-filter: blur(40px); border-top: 1px solid rgba(255,255,255,0.1); }

        .app-nav { position: fixed; bottom: env(safe-area-inset-bottom, 24px); left: 50%; transform: translateX(-50%); z-index: 40; }
        .slide-up-modal { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up-modal.closed { transform: translateY(105%); }
        .slide-up-modal.open { transform: translateY(0); }
        
        #toast { transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); transform: translateY(-100%) scale(0.9); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0) scale(1); opacity: 1; z-index: 9999; }

        input, select, textarea { background: rgba(255,255,255,0.03) !important; color: white !important; border: 1px solid rgba(255,255,255,0.08) !important; transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6 !important; background: rgba(59,130,246,0.05) !important; box-shadow: 0 0 20px rgba(59,130,246,0.2) !important; }
        select option { background: #0d0d10; color: white; }
    </style>
</head>

<body class="antialiased min-h-screen relative overflow-hidden flex flex-col">

    <!-- Ambient Background -->
    <div class="fixed top-0 inset-x-0 w-full h-[500px] bg-brand-600/10 blur-[150px] pointer-events-none rounded-full transform -translate-y-1/2"></div>
    <div class="fixed bottom-0 right-0 w-96 h-96 bg-purple-600/10 blur-[120px] pointer-events-none rounded-full"></div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-[#050505] flex flex-col items-center justify-center px-6 transition-all duration-500">
        <div class="w-full max-w-sm flex flex-col items-center relative z-10">
            <h1 class="text-4xl font-black text-white mb-2 tracking-tighter">Benaka Elite</h1>
            <p class="text-sm text-brand-500 font-bold tracking-[0.2em] uppercase mb-12">Command Center</p>
            
            <input type="password" id="admin-pwd" placeholder="Enter Access Code" class="w-full rounded-[20px] p-5 text-center font-bold text-xl tracking-widest mb-6 focus:outline-none">
            
            <button onclick="login()" class="w-full bg-white text-dark font-black tracking-wider text-lg p-5 rounded-[20px] shadow-[0_0_40px_rgba(255,255,255,0.2)] active:scale-[0.98] transition-transform">
                AUTHORIZE <i class="fa-solid fa-arrow-right ml-2 opacity-50"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full relative z-10">
        
        <header class="glass-header safe-pt px-6 pb-4 flex justify-between items-center z-30 shrink-0">
            <div>
                <h1 id="header-title" class="font-black text-3xl text-white tracking-tighter">Metrics</h1>
                <p id="header-sub" class="text-[10px] font-bold text-brand-500 uppercase tracking-widest mt-1">Today's Pulse</p>
            </div>
            <button onclick="logout()" class="w-12 h-12 rounded-full glass-pill text-white flex items-center justify-center active:scale-90 transition-transform shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
                <i class="fa-solid fa-power-off text-red-400"></i>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar pt-6 pb-36 px-5 relative h-full">

            <!-- DASHBOARD TAB -->
            <section id="tab-dashboard" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-6 rounded-[32px] shadow-lg relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-500/20 rounded-full blur-2xl group-hover:bg-brand-500/40 transition-colors"></div>
                        <div class="w-12 h-12 border border-white/10 rounded-full flex items-center justify-center mb-6 bg-white/5"><i class="fa-solid fa-car-rear text-brand-400"></i></div>
                        <h2 class="text-5xl font-black text-white tracking-tighter mb-1" id="stat-fleet">0</h2>
                        <p class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em]">Total Fleet</p>
                    </div>
                    <div class="glass-card p-6 rounded-[32px] shadow-lg relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-500/20 rounded-full blur-2xl group-hover:bg-emerald-500/40 transition-colors"></div>
                        <div class="w-12 h-12 border border-white/10 rounded-full flex items-center justify-center mb-6 bg-white/5"><i class="fa-solid fa-bolt text-emerald-400"></i></div>
                        <h2 class="text-5xl font-black text-white tracking-tighter mb-1" id="stat-active">0</h2>
                        <p class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em]">Rented</p>
                    </div>
                </div>
                
                <div class="bg-gradient-to-br from-brand-600/90 to-blue-900/90 p-8 rounded-[36px] shadow-[0_20px_50px_rgba(37,99,235,0.3)] relative overflow-hidden border border-white/10">
                    <div class="absolute right-0 top-0 w-64 h-64 bg-white/10 blur-[50px] rounded-full"></div>
                    <p class="text-[10px] font-black text-white/60 uppercase tracking-[0.3em] mb-2 relative z-10">Forecasted Revenue</p>
                    <h2 class="text-6xl font-black tracking-tighter text-white relative z-10" id="stat-rev">₹0</h2>
                </div>
            </section>

            <!-- FLEET TAB -->
            <section id="tab-fleet" class="hidden">
                <div id="fleet-list" class="space-y-5"></div>
            </section>

            <!-- BOOKINGS TAB -->
            <section id="tab-bookings" class="hidden">
                <div id="bookings-list" class="space-y-4"></div>
            </section>

        </main>

        <!-- Floating App Navigation -->
        <nav class="app-nav glass-pill rounded-[28px] px-2 py-2 flex items-center shadow-[0_30px_60px_rgba(0,0,0,0.8)] border border-white/10">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-6 py-4 rounded-[20px] bg-white/10 text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-lg"></i>
            </button>
            <button onclick="switchTab('fleet')" id="nav-fleet" class="nav-btn px-6 py-4 rounded-[20px] text-white/40 hover:text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-car-side text-lg"></i>
            </button>
            <button onclick="switchTab('bookings')" id="nav-bookings" class="nav-btn px-6 py-4 rounded-[20px] text-white/40 hover:text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-lg"></i>
            </button>
        </nav>
        
        <!-- Add FAB for Fleet (Only visible on fleet tab) -->
        <button onclick="openVehicleModal()" id="fab-add" class="fixed bottom-36 right-6 w-[68px] h-[68px] bg-white text-dark rounded-full shadow-[0_10px_30px_rgba(255,255,255,0.3)] text-2xl flex items-center justify-center active:scale-90 transition-transform z-30 hidden">
            <i class="fa-solid fa-plus font-bold"></i>
        </button>
    </div>

    <!-- VEHICLE EDITOR SHEET (FULL SCREEN) -->
    <div id="vehicle-sheet" class="fixed inset-0 z-50 flex flex-col slide-up-modal closed glass-sheet">
        <div class="safe-pt px-6 pb-5 flex items-center justify-between shrink-0 border-b border-white/10">
            <h2 id="modal-title" class="font-black text-2xl text-white tracking-tight">Add Vehicle</h2>
            <button onclick="closeVehicleModal()" class="w-12 h-12 rounded-full glass-pill flex items-center justify-center text-white/60 active:scale-90"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6 pb-36 no-scrollbar">
            <form id="vehicle-form" class="space-y-6 block">
                <input type="hidden" id="v-id">
                
                <!-- Cloudflare R2 Upload Zone -->
                <div>
                    <div class="relative w-full h-56 rounded-[32px] border border-white/10 bg-white/5 flex flex-col items-center justify-center overflow-hidden group">
                        <input type="file" id="r2-uploader" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                        <img id="v-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden z-10">
                        <div class="absolute inset-0 bg-black/40 z-[15] hidden" id="v-overlay"></div>
                        <div id="v-upload-ui" class="flex flex-col items-center justify-center z-[16] pointer-events-none">
                            <i class="fa-solid fa-camera text-4xl mb-3 text-brand-500"></i>
                            <span id="v-upload-text" class="text-xs font-bold text-white/60 uppercase tracking-widest">Tap to add photo</span>
                        </div>
                        <input type="hidden" id="v-image">
                    </div>
                </div>

                <div class="space-y-5">
                    <input type="text" id="v-name" required placeholder="Model Name (e.g. BMW X7)" class="w-full p-5 rounded-[20px] text-base font-bold outline-none placeholder:font-normal placeholder:text-white/30">
                    <div class="flex gap-4">
                        <select id="v-type" class="w-full p-5 rounded-[20px] text-sm font-bold outline-none flex-1">
                            <option value="SUV">SUV</option><option value="Sedan">Sedan</option><option value="Electric">Electric</option><option value="Luxury">Luxury</option><option value="Truck">Truck</option>
                        </select>
                        <input type="number" id="v-rate" required placeholder="₹/Day" class="w-full p-5 rounded-[20px] text-sm font-bold outline-none flex-1">
                    </div>
                    <input type="text" id="v-plate" placeholder="License Plate" class="w-full p-5 rounded-[20px] text-sm font-bold outline-none uppercase placeholder:font-normal placeholder:text-white/30">
                    <textarea id="v-desc" rows="3" placeholder="Luxury description..." class="w-full p-5 rounded-[20px] text-sm outline-none placeholder:text-white/30"></textarea>
                    <input type="text" id="v-feats" placeholder='["Leather", "Sunroof"]' class="w-full p-5 rounded-[20px] text-sm font-mono outline-none placeholder:text-white/20 text-brand-300">
                </div>
            </form>
        </div>

        <div class="fixed bottom-0 inset-x-0 safe-pb px-6 pb-6 pt-4 bg-[#0d0d10]/90 backdrop-blur-xl border-t border-white/5 z-50 shrink-0">
            <button onclick="saveVehicle()" id="btn-save" class="w-full py-5 bg-white text-dark rounded-[24px] font-black uppercase tracking-wider text-base shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-[0.98] transition-all">Save to Fleet</button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-[env(safe-area-inset-top,20px)] left-1/2 -translate-x-1/2 max-w-[90%] z-[1000] flex justify-center mt-4">
        <div class="px-6 py-4 rounded-[20px] bg-white text-dark shadow-[0_20px_40px_rgba(0,0,0,0.8)] flex items-center gap-3 font-bold text-sm">
            <i id="toast-icon" class="fa-solid fa-circle-check text-green-500 text-lg"></i>
            <span id="toast-msg">Updated</span>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let token = localStorage.getItem('adminToken');
        let appVehicles = []; let appBookings = [];

        if(token) {
            document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => document.getElementById('login-screen').classList.add('hidden'), 500);
            document.getElementById('app-screen').classList.remove('hidden');
            loadData();
        }

        async function login() {
            const pwd = document.getElementById('admin-pwd').value;
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pwd}) });
                const data = await res.json();
                if(data.success) {
                    token = data.token; localStorage.setItem('adminToken', token);
                    document.getElementById('login-screen').classList.add('opacity-0');
                    setTimeout(() => { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden'); loadData(); }, 300);
                } else { toast(data.message || 'Denied', true); btn.innerHTML = 'AUTHORIZE <i class="fa-solid fa-arrow-right ml-2 opacity-50"></i>'; }
            } catch(e) { toast("Network Error", true); btn.innerHTML = 'AUTHORIZE'; }
        }

        function logout() { localStorage.removeItem('adminToken'); location.reload(); }

        function switchTab(tabId) {
            ['dashboard', 'fleet', 'bookings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('bg-white/10', 'text-white');
                document.getElementById(`nav-${t}`).classList.add('text-white/40');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.remove('text-white/40');
            document.getElementById(`nav-${tabId}`).classList.add('bg-white/10', 'text-white');

            const titles = { dashboard: ['Metrics', "Today's Pulse"], fleet: ['Fleet', 'Manage Units'], bookings: ['Bookings', 'Rental Log']};
            document.getElementById('header-title').textContent = titles[tabId][0];
            document.getElementById('header-sub').textContent = titles[tabId][1];
            
            const fab = document.getElementById('fab-add');
            tabId === 'fleet' ? fab.classList.remove('hidden') : fab.classList.add('hidden');

            if(tabId === 'fleet') renderFleet();
            if(tabId === 'bookings') loadBookings();
        }

        async function loadData() {
            try {
                const res = await fetch('/api/vehicles', {headers: {'Authorization': `Bearer ${token}`}});
                if(res.status === 401) return logout();
                const d = await res.json();
                if(d.success) { appVehicles = d.data; updateDash(); if(document.getElementById('tab-fleet').classList.contains('hidden')===false) renderFleet(); }
            } catch(e) { toast("API Error", true); }
        }

        async function loadBookings() {
            try {
                const res = await fetch('/api/bookings', {headers: {'Authorization': `Bearer ${token}`}});
                if(res.status === 401) return logout();
                const d = await res.json();
                if(d.success) { appBookings = d.data; renderBookings(); }
            } catch(e) {}
        }

        function updateDash() {
            document.getElementById('stat-fleet').textContent = appVehicles.length;
            document.getElementById('stat-active').textContent = appVehicles.filter(v => v.is_available === 0 || v.is_available === false).length;
            fetch('/api/bookings', {headers: {'Authorization': `Bearer ${token}`}}).then(r=>r.json()).then(d=>{
                if(d.success) {
                    const total = d.data.reduce((sum, b) => sum + parseInt(b.total_price||0), 0);
                    document.getElementById('stat-rev').textContent = '₹' + total.toLocaleString();
                }
            });
        }

        document.getElementById('r2-uploader').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if(!file) return;
            const uiStatus = document.getElementById('v-upload-text');
            const icon = document.getElementById('v-upload-ui').querySelector('i');
            
            uiStatus.textContent = "UPLOADING TO R2...";
            icon.className = "fa-solid fa-spinner fa-spin text-4xl mb-3 text-brand-400";
            
            const formData = new FormData(); formData.append('image', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('v-image').value = data.url;
                    const r = new FileReader(); r.onload = function(e) {
                        document.getElementById('v-preview').src = e.target.result;
                        document.getElementById('v-preview').classList.remove('hidden');
                        document.getElementById('v-overlay').classList.remove('hidden');
                        icon.className = "fa-solid fa-check text-4xl mb-3 text-white shadow-lg";
                        uiStatus.textContent = "IMAGE SECURED";
                        document.getElementById('v-upload-ui').classList.add('text-white');
                    }; r.readAsDataURL(file);
                } else { toast("Upload failed", true); resetUploadUI(); }
            } catch(err) { toast("Network error", true); resetUploadUI(); }
        });

        function resetUploadUI() {
            const uiStatus = document.getElementById('v-upload-text');
            const icon = document.getElementById('v-upload-ui').querySelector('i');
            uiStatus.textContent = "Tap to add photo";
            icon.className = "fa-solid fa-camera text-4xl mb-3 text-brand-500";
            document.getElementById('v-upload-ui').classList.remove('text-white');
        }

        function openVehicleModal(v = null) {
            document.getElementById('vehicle-form').reset();
            document.getElementById('v-id').value = '';
            document.getElementById('v-preview').classList.add('hidden');
            document.getElementById('v-overlay').classList.add('hidden');
            resetUploadUI();

            if(v) {
                document.getElementById('modal-title').textContent = 'Modify Asset';
                document.getElementById('v-id').value = v.id; document.getElementById('v-name').value = v.name;
                document.getElementById('v-type').value = v.type; document.getElementById('v-rate').value = v.daily_rate;
                document.getElementById('v-plate').value = v.plate_number; document.getElementById('v-desc').value = v.description;
                document.getElementById('v-feats').value = v.features; document.getElementById('v-image').value = v.image_url;
                if(v.image_url) {
                    document.getElementById('v-preview').src = v.image_url;
                    document.getElementById('v-preview').classList.remove('hidden');
                    document.getElementById('v-overlay').classList.remove('hidden');
                    document.getElementById('v-upload-text').textContent = "CHANGE PHOTO";
                }
            } else { document.getElementById('modal-title').textContent = 'Add Fleet Vehicle'; }

            const sheet = document.getElementById('vehicle-sheet');
            sheet.classList.remove('closed'); sheet.classList.add('open');
        }

        function closeVehicleModal() { document.getElementById('vehicle-sheet').classList.remove('open'); document.getElementById('vehicle-sheet').classList.add('closed'); }

        async function saveVehicle() {
            const id = document.getElementById('v-id').value;
            const btn = document.getElementById('btn-save'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            const payload = {
                name: document.getElementById('v-name').value, type: document.getElementById('v-type').value,
                daily_rate: document.getElementById('v-rate').value, image_url: document.getElementById('v-image').value,
                plate_number: document.getElementById('v-plate').value, description: document.getElementById('v-desc').value,
                features: document.getElementById('v-feats').value || "[]"
            };
            try {
                const res = await fetch('/api/vehicles', { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(id ? {id, ...payload} : payload) });
                if(res.ok) { toast('Fleet Updated'); closeVehicleModal(); loadData(); } else { toast("Error", true); }
            } catch(e) { toast("Error", true); }
            btn.innerHTML = 'Save to Fleet';
        }

        async function toggleAvailability(id, is_available) {
            try { fetch('/api/vehicles', { method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization':`Bearer ${token}`}, body: JSON.stringify({id, is_available: !is_available}) }).then(() => loadData()); } catch(e){}
        }

        async function delVehicle(id) {
            if(!confirm("Erase vehicle permanently?")) return;
            try { const res = await fetch(`/api/vehicles?id=${id}`, { method: 'DELETE', headers: {'Authorization':`Bearer ${token}`} }); if(res.ok) { loadData(); } } catch(e){}
        }

        function renderFleet() {
            const list = document.getElementById('fleet-list'); list.innerHTML = '';
            if(!appVehicles.length) return list.innerHTML = '<p class="text-center text-white/40 mt-10 text-sm font-bold tracking-widest uppercase">No vehicles deployed</p>';
            
            appVehicles.forEach((v,i) => {
                const isAvail = v.is_available === 1 || v.is_available === true;
                list.innerHTML += `
                    <div class="glass-card rounded-[28px] overflow-hidden flex flex-col transform transition-all animate-fade-up" style="animation-delay: ${i*0.05}s">
                        <div class="flex gap-4 p-4">
                            <div class="w-28 h-28 rounded-[20px] bg-white/5 shrink-0 overflow-hidden relative">
                                <img src="${v.image_url}" class="w-full h-full object-cover">
                                ${!isAvail ? '<div class="absolute inset-0 bg-red-500/80 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-lock text-white"></i></div>':''}
                            </div>
                            <div class="flex-1 py-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="font-black text-xl leading-none text-white tracking-tight mb-1">${v.name}</h3>
                                    <span class="text-[10px] font-bold text-brand-400 uppercase tracking-widest">${v.type}</span>
                                </div>
                                <div class="text-2xl font-black text-white">₹${v.daily_rate}<span class="text-xs text-white/40 uppercase tracking-widest font-bold ml-1">/d</span></div>
                            </div>
                        </div>
                        <div class="flex border-t border-white/5">
                            <button onclick='openVehicleModal(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="flex-1 py-4 text-white hover:bg-white/5 transition-colors"><i class="fa-solid fa-pen"></i></button>
                            <div class="w-px bg-white/5"></div>
                            <button onclick='toggleAvailability(${v.id}, ${isAvail})' class="flex-1 py-4 text-white hover:bg-white/5 transition-colors"><i class="fa-solid ${isAvail ? 'fa-eye' : 'fa-eye-slash text-red-400'}"></i></button>
                            <div class="w-px bg-white/5"></div>
                            <button onclick='delVehicle(${v.id})' class="flex-1 py-4 text-red-500 hover:bg-white/5 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function renderBookings() {
            const list = document.getElementById('bookings-list'); list.innerHTML = '';
            if(!appBookings.length) return list.innerHTML = '<p class="text-center text-white/40 mt-10 text-sm font-bold tracking-widest uppercase">No pending action</p>';

            appBookings.forEach(b => {
                const c = { 'pending': 'bg-amber-500/20 text-amber-400 border-amber-500/30', 'confirmed': 'bg-blue-500/20 text-blue-400 border-blue-500/30', 'completed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', 'cancelled': 'bg-red-500/20 text-red-400 border-red-500/30' }[b.status] || 'bg-white/10 text-white';
                list.innerHTML += `
                    <div class="glass-card p-5 rounded-[28px]">
                        <div class="flex justify-between items-start mb-4 border-b border-white/5 pb-4">
                            <div>
                                <h4 class="font-black text-xl text-white tracking-tight leading-none mb-1">${b.customer_name}</h4>
                                <p class="text-[10px] font-bold text-white/40 tracking-widest uppercase">${b.start_date.slice(5)} to ${b.end_date.slice(5)}</p>
                            </div>
                            <span class="text-[9px] font-black uppercase tracking-[0.2em] px-3 py-1.5 rounded-full border ${c}">${b.status}</span>
                        </div>
                        <div class="flex justify-between items-end mb-4">
                            <div><p class="text-[10px] uppercase font-bold text-white/30 tracking-widest mb-0.5">Asset Req</p><p class="font-bold text-white/90 text-sm">${b.vehicle_name}</p></div>
                            <div class="text-right"><p class="text-[10px] uppercase font-bold text-brand-500 tracking-widest mb-0.5">Value</p><p class="font-black text-white text-2xl leading-none">₹${b.total_price}</p></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateBooking(${b.id}, 'confirmed')" class="flex-1 py-3 rounded-[16px] bg-white/5 text-white text-xs font-bold uppercase tracking-wider active:scale-95 text-blue-400">Confirm</button>
                            <button onclick="updateBooking(${b.id}, 'completed')" class="flex-1 py-3 rounded-[16px] bg-white/5 text-white text-xs font-bold uppercase tracking-wider active:scale-95 text-emerald-400">End</button>
                            <button onclick="updateBooking(${b.id}, 'cancelled')" class="flex-1 py-3 rounded-[16px] bg-white/5 text-white text-xs font-bold uppercase tracking-wider active:scale-95 text-red-400 opacity-50">Kill</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateBooking(id, status) { try { await fetch('/api/bookings', { method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization':`Bearer ${token}`}, body: JSON.stringify({id, status}) }); loadBookings(); } catch(e){} }

        function toast(msg, isErr=false) {
            const t = document.getElementById('toast'); document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').className = isErr ? 'fa-solid fa-triangle-exclamation text-red-500 text-lg' : 'fa-solid fa-circle-check text-green-400 text-lg';
            t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
        }
        if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.update())); }
    </script>
</body>
</html>
