<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Benaka Travels - Admin</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/benaka_travels_logo.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        dark: '#0f172a'
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards' },
                    keyframes: { fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } } }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 40px); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }

        .slide-up-modal { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up-modal.closed { transform: translateY(100%); }
        .slide-up-modal.open { transform: translateY(0); }
        
        /* Toast logic */
        #toast { transition: all 0.3s; transform: translateY(-20px); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; z-index: 9999; }
    </style>
</head>

<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-full max-w-sm flex flex-col items-center">
            <div class="w-20 h-20 rounded-2xl bg-brand-600 flex items-center justify-center shadow-2xl text-white font-bold text-4xl mb-6">
                B
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-1 tracking-tight">Benaka Travels Dashboard</h1>
            <p class="text-sm text-slate-500 mb-8 font-medium">Authorized personnel only</p>
            
            <input type="password" id="admin-pwd" placeholder="Master Password" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-center font-bold text-xl tracking-[0.3em] mb-4 focus:ring-2 focus:ring-brand-500 outline-none transition-shadow">
            
            <button onclick="login()" class="w-full bg-slate-900 text-white font-bold text-lg p-4 rounded-xl shadow-lg shadow-slate-900/20 active:scale-95 transition-transform">
                Sign In <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- MAIN ADMIN APP -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full bg-slate-50">
        
        <!-- Native App Header -->
        <header class="glass-panel safe-pt px-6 pb-4 flex justify-between items-center z-30 shadow-sm shrink-0">
            <div>
                <h1 id="header-title" class="font-extrabold text-2xl text-slate-900 tracking-tight">Overview</h1>
                <p id="header-sub" class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-0.5">Today Performance</p>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center active:scale-95 shadow-inner border border-slate-200">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </header>

        <!-- Scrollable Tab Views -->
        <main class="flex-1 overflow-y-auto no-scrollbar relative px-4 pt-4 pb-28">

            <!-- TAB: Dashboard -->
            <section id="tab-dashboard" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-5 rounded-[24px] shadow-sm border border-slate-100">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center mb-4"><i class="fa-solid fa-car-rear"></i></div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Fleet</p>
                        <h2 class="text-3xl font-black text-slate-900" id="stat-fleet">0</h2>
                    </div>
                    <div class="bg-white p-5 rounded-[24px] shadow-sm border border-slate-100">
                        <div class="w-10 h-10 rounded-full bg-green-50 text-green-500 flex items-center justify-center mb-4"><i class="fa-solid fa-circle-check"></i></div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Active Rents</p>
                        <h2 class="text-3xl font-black text-slate-900" id="stat-active">0</h2>
                    </div>
                </div>
                <div class="bg-slate-900 p-6 rounded-[24px] shadow-lg shadow-slate-900/20 text-white relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
                    <div class="w-12 h-12 rounded-full bg-white/10 text-white flex items-center justify-center mb-6 backdrop-blur-md border border-white/20"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                    <p class="text-xs font-bold text-white/50 uppercase tracking-wider mb-1">Total Expected Revenue</p>
                    <h2 class="text-4xl font-black tracking-tight" id="stat-rev">₹0</h2>
                </div>
            </section>

            <!-- TAB: Fleet Management -->
            <section id="tab-fleet" class="hidden">
                <div id="fleet-list" class="space-y-4"></div>
                <!-- Floating Action Button -->
                <button onclick="openVehicleModal()" class="fixed bottom-[100px] right-6 w-16 h-16 bg-brand-600 rounded-full shadow-xl shadow-brand-500/40 text-white text-2xl flex items-center justify-center active:scale-90 transition-transform z-40">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </section>

            <!-- TAB: Bookings -->
            <section id="tab-bookings" class="hidden">
                <div id="bookings-list" class="space-y-3"></div>
            </section>

        </main>

        <!-- Bottom Navigation Tabs -->
        <nav class="bg-white border-t border-slate-100 safe-pb z-30 pb-2 pt-3 px-6 flex justify-around shadow-[0_-10px_40px_rgba(0,0,0,0.03)] shrink-0">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center gap-1 text-brand-600 w-16">
                <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Metrics</span>
            </button>
            <button onclick="switchTab('fleet')" id="nav-fleet" class="nav-btn flex flex-col items-center gap-1 text-slate-400 w-16">
                <i class="fa-solid fa-car text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Fleet</span>
            </button>
            <button onclick="switchTab('bookings')" id="nav-bookings" class="nav-btn flex flex-col items-center gap-1 text-slate-400 w-16">
                <i class="fa-solid fa-calendar-check text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Bookings</span>
            </button>
        </nav>
    </div>

    <!-- ADD/EDIT VEHICLE NATIVE MODAL (FULL SCREEN SHEET) -->
    <div id="vehicle-sheet" class="fixed inset-0 z-50 bg-white flex flex-col slide-up-modal closed">
        <!-- Sheet Header -->
        <div class="safe-pt px-4 pb-4 border-b border-slate-100 flex items-center justify-between shrink-0 glass-panel">
            <button onclick="closeVehicleModal()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:scale-95"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="modal-title" class="font-bold text-lg text-slate-900">Add Vehicle</h2>
            <div class="w-10"></div> <!-- Spacer for flex alignment -->
        </div>

        <!-- Scrollable Form Content -->
        <div class="flex-1 overflow-y-auto p-5 pb-32">
            <form id="vehicle-form" class="space-y-6 block">
                <input type="hidden" id="v-id">
                
                <!-- Cloudflare R2 Native Uploader -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Vehicle Photo</label>
                    <div class="relative w-full h-48 bg-slate-50 rounded-[20px] border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 overflow-hidden group">
                        <!-- File Input -->
                        <input type="file" id="r2-uploader" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                        
                        <!-- Preview Image -->
                        <img id="v-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden z-10 bg-slate-100">
                        
                        <!-- Upload UI Content -->
                        <div id="v-upload-ui" class="flex flex-col items-center justify-center z-10 pointer-events-none transition-opacity">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl mb-2 text-brand-500"></i>
                            <span id="v-upload-text" class="text-sm font-bold text-slate-600">Tap to browse photo</span>
                        </div>
                        
                        <!-- Hidden underlying URL field to store R2 CDN path -->
                        <input type="hidden" id="v-image">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Model Name</label>
                        <input type="text" id="v-name" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold placeholder:font-normal focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Category</label>
                        <select id="v-type" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold outline-none leading-none">
                            <option value="SUV">SUV</option><option value="Sedan">Sedan</option><option value="Electric">Electric</option><option value="Luxury">Luxury</option><option value="Truck">Truck</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Daily Rate (₹)</label>
                        <input type="number" id="v-rate" required class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Plate Number</label>
                        <input type="text" id="v-plate" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none uppercase">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Description</label>
                    <textarea id="v-desc" rows="3" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5">Features (JSON Array)</label>
                    <input type="text" id="v-feats" placeholder='["AC", "Bluetooth"]' class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm font-mono focus:ring-2 focus:ring-brand-500 outline-none">
                </div>
            </form>
        </div>

        <!-- Sticky Bottom Save Action -->
        <div class="fixed bottom-0 inset-x-0 safe-pb px-4 pb-4 pt-2 bg-white/80 backdrop-blur-xl border-t border-slate-100 z-50 shrink-0">
            <button onclick="saveVehicle()" id="btn-save" class="w-full py-4 bg-slate-900 text-white rounded-[16px] font-bold text-lg shadow-xl shadow-slate-900/20 active:scale-95 transition-all">Save Vehicle</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-12 inset-x-4 mx-auto max-w-sm safe-pt z-[1000] flex justify-center">
        <div class="px-5 py-3 rounded-full bg-slate-900 text-white shadow-2xl flex items-center gap-2 font-bold text-sm tracking-wide">
            <i id="toast-icon" class="fa-solid fa-circle-check text-brand-400"></i>
            <span id="toast-msg">Success</span>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let token = localStorage.getItem('adminToken');
        let appVehicles = [];
        let appBookings = [];

        // App Initialization
        if(token) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadData();
        }

        // --- Auth ---
        async function login() {
            const pwd = document.getElementById('admin-pwd').value;
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pwd})
                });
                const data = await res.json();
                
                if(data.success) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    document.getElementById('login-screen').classList.add('opacity-0');
                    setTimeout(() => {
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app-screen').classList.remove('hidden');
                        loadData();
                    }, 300);
                } else {
                    toast(data.message || 'Invalid Password', true);
                    btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right ml-1"></i>';
                }
            } catch(e) {
                toast("Connection Error", true);
                btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right ml-1"></i>';
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        // --- Navigation ---
        function switchTab(tabId) {
            // Update UI State
            ['dashboard', 'fleet', 'bookings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-brand-600');
                document.getElementById(`nav-${t}`).classList.add('text-slate-400');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.remove('text-slate-400');
            document.getElementById(`nav-${tabId}`).classList.add('text-brand-600');

            // Dynamic headers
            const titles = { dashboard: ['Overview', 'Today Performance'], fleet: ['Fleet', 'Manage Vehicles'], bookings: ['Bookings', 'Rental Log']};
            document.getElementById('header-title').textContent = titles[tabId][0];
            document.getElementById('header-sub').textContent = titles[tabId][1];
            
            if(tabId === 'fleet') renderFleet();
            if(tabId === 'bookings') loadBookings();
        }

        // --- Data Fetching ---
        async function loadData() {
            try {
                const res = await fetch('/api/vehicles', {headers: {'Authorization': `Bearer ${token}`}});
                if(res.status === 401) return logout();
                const d = await res.json();
                if(d.success) { appVehicles = d.data; updateDash(); renderFleet(); }
            } catch(e) { toast("Error fetching vehicles", true); }
        }

        async function loadBookings() {
            try {
                const res = await fetch('/api/bookings', {headers: {'Authorization': `Bearer ${token}`}});
                if(res.status === 401) return logout();
                const d = await res.json();
                if(d.success) { appBookings = d.data; renderBookings(); }
            } catch(e) {}
        }

        function updateDash() {
            document.getElementById('stat-fleet').textContent = appVehicles.length;
            document.getElementById('stat-active').textContent = appVehicles.filter(v => v.is_available === 0 || v.is_available === false).length;
            // Lazy load bookings for revenue
            fetch('/api/bookings', {headers: {'Authorization': `Bearer ${token}`}}).then(r=>r.json()).then(d=>{
                if(d.success) {
                    const total = d.data.reduce((sum, b) => sum + parseInt(b.total_price||0), 0);
                    document.getElementById('stat-rev').textContent = '₹' + total.toLocaleString();
                }
            });
        }

        // --- R2 Uploader ---
        document.getElementById('r2-uploader').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const uiStatus = document.getElementById('v-upload-text');
            const icon = document.getElementById('v-upload-ui').querySelector('i');
            
            uiStatus.textContent = "Uploading securely to R2...";
            icon.className = "fa-solid fa-spinner fa-spin text-3xl mb-2 text-brand-500";

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('v-image').value = data.url; // Save R2 proxy url
                    // Preview
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('v-preview').src = e.target.result;
                        document.getElementById('v-preview').classList.remove('hidden');
                        document.getElementById('v-upload-ui').classList.add('opacity-0'); // Hide icon
                    }
                    reader.readAsDataURL(file);
                    toast("Photo Uploaded & Optimized!");
                } else {
                    toast(data.error || "Upload failed", true);
                    uiStatus.textContent = "Tap to browse photo";
                    icon.className = "fa-solid fa-cloud-arrow-up text-3xl mb-2 text-brand-500";
                }
            } catch(err) {
                toast("Network error during upload", true);
                uiStatus.textContent = "Tap to browse photo";
                icon.className = "fa-solid fa-cloud-arrow-up text-3xl mb-2 text-brand-500";
            }
        });

        // --- Vehicle Modal (Full Screen iOS Action Sheet Style) ---
        function openVehicleModal(vehicle = null) {
            document.getElementById('vehicle-form').reset();
            document.getElementById('v-id').value = '';
            document.getElementById('v-preview').classList.add('hidden');
            document.getElementById('v-upload-ui').classList.remove('opacity-0');
            document.getElementById('v-upload-text').textContent = "Tap to browse photo";
            document.getElementById('v-upload-ui').querySelector('i').className = "fa-solid fa-cloud-arrow-up text-3xl mb-2 text-brand-500";

            if(vehicle) {
                document.getElementById('modal-title').textContent = 'Edit Fleet Details';
                document.getElementById('v-id').value = vehicle.id;
                document.getElementById('v-name').value = vehicle.name;
                document.getElementById('v-type').value = vehicle.type;
                document.getElementById('v-rate').value = vehicle.daily_rate;
                document.getElementById('v-plate').value = vehicle.plate_number;
                document.getElementById('v-desc').value = vehicle.description;
                document.getElementById('v-feats').value = vehicle.features;
                document.getElementById('v-image').value = vehicle.image_url;
                if(vehicle.image_url) {
                    document.getElementById('v-preview').src = vehicle.image_url;
                    document.getElementById('v-preview').classList.remove('hidden');
                    document.getElementById('v-upload-ui').classList.add('opacity-0');
                }
            } else {
                document.getElementById('modal-title').textContent = 'Add Fleet Vehicle';
            }

            const sheet = document.getElementById('vehicle-sheet');
            sheet.classList.remove('closed');
            sheet.classList.add('open');
        }

        function closeVehicleModal() {
            const sheet = document.getElementById('vehicle-sheet');
            sheet.classList.remove('open');
            sheet.classList.add('closed');
        }

        // --- Save CRUD ---
        async function saveVehicle() {
            const id = document.getElementById('v-id').value;
            const btn = document.getElementById('btn-save');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            
            const payload = {
                name: document.getElementById('v-name').value,
                type: document.getElementById('v-type').value,
                daily_rate: document.getElementById('v-rate').value,
                image_url: document.getElementById('v-image').value,
                plate_number: document.getElementById('v-plate').value,
                description: document.getElementById('v-desc').value,
                features: document.getElementById('v-feats').value || "[]"
            };

            const method = id ? 'PUT' : 'POST';
            if (id) payload.id = id;

            try {
                const res = await fetch('/api/vehicles', {
                    method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    toast(id ? 'Details updated' : 'Added to fleet');
                    closeVehicleModal();
                    loadData(); // reload all
                } else {
                    toast("Database Error", true);
                }
            } catch(e) { toast("Network Error", true); }
            
            setTimeout(() => { btn.innerHTML = 'Save Vehicle'; }, 500);
        }

        async function toggleAvailability(id, is_available) {
            try {
                fetch('/api/vehicles', {
                    method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization':`Bearer ${token}`},
                    body: JSON.stringify({id, is_available: !is_available})
                }).then(() => loadData());
            } catch(e){}
        }

        async function delVehicle(id) {
            if(!confirm("Are you sure? This cannot be undone.")) return;
            try {
                const res = await fetch(`/api/vehicles?id=${id}`, { method: 'DELETE', headers: {'Authorization':`Bearer ${token}`} });
                if(res.ok) { toast("Vehicle removed remotely."); loadData(); }
            } catch(e){}
        }

        // --- Render Views ---
        function renderFleet() {
            const list = document.getElementById('fleet-list');
            list.innerHTML = '';
            if(appVehicles.length === 0) list.innerHTML = '<p class="text-center text-slate-400 font-bold py-10">Fleet is empty.</p>';
            
            appVehicles.forEach(v => {
                const isAvail = v.is_available === 1 || v.is_available === true;
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-[24px] shadow-sm border border-slate-100 flex gap-4 items-center">
                        <div class="w-24 h-24 rounded-[16px] bg-slate-100 shrink-0 overflow-hidden relative shadow-inner">
                            <img src="${v.image_url}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-extrabold text-slate-900 truncate tracking-tight text-lg mb-0.5">${v.name}</h3>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] font-bold uppercase tracking-widest bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${v.type}</span>
                                <span class="text-sm font-black text-brand-600">₹${v.daily_rate}/d</span>
                            </div>
                            <!-- Actions Native Row -->
                            <div class="flex gap-2">
                                <button onclick='openVehicleModal(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="flex-1 py-2 rounded-lg bg-emerald-50 text-emerald-600 font-extrabold text-xs active:scale-95 transition-transform"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick='toggleAvailability(${v.id}, ${isAvail})' class="flex-1 py-2 rounded-lg font-extrabold text-xs active:scale-95 transition-transform ${isAvail ? 'bg-blue-50 text-blue-600' : 'bg-orange-50 text-orange-600'}">
                                    <i class="fa-solid ${isAvail ? 'fa-eye' : 'fa-eye-slash'}"></i>
                                </button>
                                <button onclick='delVehicle(${v.id})' class="flex-1 py-2 rounded-lg bg-red-50 text-red-600 font-extrabold text-xs active:scale-95 transition-transform"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderBookings() {
            const list = document.getElementById('bookings-list');
            list.innerHTML = '';
            if(appBookings.length === 0) list.innerHTML = '<p class="text-center text-slate-400 font-bold py-10">No recent reservations.</p>';

            appBookings.forEach(b => {
                const colors = { 'pending': 'bg-amber-100 text-amber-700', 'confirmed': 'bg-blue-100 text-blue-700', 'completed': 'bg-emerald-100 text-emerald-700', 'cancelled': 'bg-red-100 text-red-700' };
                const c = colors[b.status] || colors['pending'];

                list.innerHTML += `
                    <div class="bg-white p-4 rounded-[20px] shadow-sm border border-slate-100">
                        <div class="flex justify-between items-start mb-3 border-b border-slate-100 pb-3">
                            <div>
                                <h4 class="font-extrabold text-slate-900 text-lg">${b.customer_name}</h4>
                                <p class="text-xs font-bold text-slate-400 tracking-wide mt-0.5">${b.start_date} <i class="fa-solid fa-arrow-right-long mx-1 opacity-50"></i> ${b.end_date}</p>
                            </div>
                            <span class="text-[10px] font-black uppercase tracking-widest px-2.5 py-1 flex items-center rounded-full ${c}">${b.status}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Booked Vehicle</p>
                                <p class="font-bold text-slate-800 text-sm">${b.vehicle_name}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Expected Revenue</p>
                                <p class="font-black text-brand-600 text-base">₹${b.total_price.toLocaleString()}</p>
                            </div>
                        </div>
                        <!-- Status Updates Row -->
                        <div class="mt-4 flex gap-2 pt-3 border-t border-slate-100">
                            <button onclick="updateBooking(${b.id}, 'confirmed')" class="flex-1 text-xs font-bold bg-slate-50 border border-slate-200 py-2 rounded-lg text-slate-600 active:bg-slate-100">Confirm</button>
                            <button onclick="updateBooking(${b.id}, 'completed')" class="flex-1 text-xs font-bold bg-slate-50 border border-slate-200 py-2 rounded-lg text-slate-600 active:bg-slate-100">Complete</button>
                            <button onclick="updateBooking(${b.id}, 'cancelled')" class="flex-1 text-xs font-bold bg-slate-50 border border-slate-200 py-2 rounded-lg text-red-500 active:bg-slate-100">Cancel</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateBooking(id, status) {
            try {
                const res = await fetch('/api/bookings', {
                    method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization':`Bearer ${token}`},
                    body: JSON.stringify({id, status})
                });
                if(res.ok) { toast("Reservation updated"); loadBookings(); }
            } catch(e){}
        }

        // --- Utils ---
        function toast(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            const icon = document.getElementById('toast-icon');
            icon.className = isError ? 'fa-solid fa-circle-exclamation text-red-500' : 'fa-solid fa-circle-check text-brand-400';
            
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
